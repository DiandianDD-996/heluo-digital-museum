# Explicit opt-in. Never use with unsigned cards or an unapproved model.
services:
  backend:
    environment:
      MUSEUM_GUIDE_ENABLED: "true"
      MUSEUM_GUIDE_PACK_PATH: /run/luosheng/ding.zh-CN.json
      MUSEUM_GUIDE_MINIMUM_VERSION_PATH: /run/luosheng/minimum-release-version.txt
      MUSEUM_GUIDE_APPROVED_DIGEST_PATH: /run/luosheng/ding.zh-CN.sha256
      MUSEUM_GUIDE_PAUSE_PATH: /run/luosheng/pause
      MUSEUM_GUIDE_MODEL_ENDPOINT: ${MUSEUM_GUIDE_MODEL_ENDPOINT:?set the approved model endpoint}
      MUSEUM_GUIDE_MODEL_NAME: ${MUSEUM_GUIDE_MODEL_NAME:?set the approved model name}
      MUSEUM_GUIDE_MODEL_KEY: ${MUSEUM_GUIDE_MODEL_KEY:?inject the approved model credential}
      MUSEUM_GUIDE_DAILY_TURN_LIMIT: ${MUSEUM_GUIDE_DAILY_TURN_LIMIT:?set the approved daily call limit}
    volumes:
      - type: bind
        source: ${MUSEUM_GUIDE_RELEASE_DIR:?set the signed guide release directory}
        target: /run/luosheng
        read_only: true
        bind:
          create_host_path: false
  frontend:
    build:
      args:
        VITE_GUIDE_ENABLED: "true"
